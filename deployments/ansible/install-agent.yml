---
- name: Deploy SentinelCore Agent to Customer Nodes
  hosts: customer_servers
  become: yes
  vars:
    hub_base_url: "https://hub.systemhaus-xy.de"
    enroll_token: "{{ vault_enroll_token }}"
    tenant_id: "{{ vault_tenant_id }}"
    customer_id: "{{ vault_customer_id }}"
    agent_encryption_key: "{{ vault_agent_encryption_key }}"

  tasks:
    - name: Create agent installation directory
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/sentinel-agent
        - /etc/sentinel/certs
        - /var/lib/sentinel

    - name: Copy agent binary
      copy:
        src: "../../bin/sentinel-agent"
        dest: "/opt/sentinel-agent/sentinel-agent"
        mode: '0755'

    - name: Copy mTLS certificates
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: '0600'
      loop:
        - { src: "../../certs/agent.crt", dest: "/etc/sentinel/certs/agent.crt" }
        - { src: "../../certs/agent.key", dest: "/etc/sentinel/certs/agent.key" }
        - { src: "../../certs/ca.crt", dest: "/etc/sentinel/certs/ca.crt" }

    - name: Configure agent environment file
      template:
        src: "templates/sentinel-agent.env.j2"
        dest: "/etc/default/sentinel-agent"
        mode: '0600'

    - name: Copy systemd service file
      copy:
        src: "../systemd/sentinel-agent.service"
        dest: "/etc/systemd/system/sentinel-agent.service"
        mode: '0644'

    - name: Reload systemd and start agent
      systemd:
        name: sentinel-agent
        daemon_reload: yes
        enabled: yes
        state: restarted
