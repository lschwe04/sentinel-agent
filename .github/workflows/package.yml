name: Package Sentinel Agent

on:
  release:
    types: [created]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o sentinel-agent cmd/agent/main.go

      - name: Create Tarball Artifact
        run: tar -czvf sentinel-agent-linux-amd64.tar.gz sentinel-agent deployments/systemd/sentinel-agent.service configs/agent.yaml

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: sentinel-agent-linux-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
