name: Sentinel Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Abhängigkeiten laden
        run: go mod download

      - name: Linter / Code-Prüfung (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Kompilierungstest (Agent bauen)
        run: go build -v -o sentinel-agent ./cmd/agent/main.go
